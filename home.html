<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- tailwind + daisyui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-[#F8FAFC]">
    <header>
      <nav class="p-2 mx-7">
        <div class="flex justify-between items-center">
          <!-- logo + title -->
          <div class="flex items-center justify-center gap-2">
            <img
              class="w-[36px] h-[37px]"
              src="./assets/github-logo.png"
              alt=""
            />
            <h3 class="text-[24px] font-semibold">GitHub Issues Tracker</h3>
          </div>
          <!-- search bar -->
          <div class="flex items-center justify-center gap-2">
            <label class="input">
              <svg
                class="h-[1em] opacity-50"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
              >
                <g
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  stroke-width="2.5"
                  fill="none"
                  stroke="currentColor"
                >
                  <circle cx="11" cy="11" r="8"></circle>
                  <path d="m21 21-4.3-4.3"></path>
                </g>
              </svg>
              <input
                id="searchInput"
                type="search"
                required
                placeholder="Search issues.."
              />
            </label>
            <!-- search button -->
            <button id="searchBtn" class="btn btn-primary">Search</button>
          </div>
        </div>
      </nav>
    </header>
    <main class="w-[1110px] mt-10 mx-auto">
      <!-- all open closed -->
      <section>
        <div id="select" class="bg-white gap-5 flex flex-direction-col">
          <button class="btn btn-xs sm:btn-sm md:btn-md lg:btn-lg xl:btn-xl">
            All
          </button>
          <button class="btn btn-xs sm:btn-sm md:btn-md lg:btn-lg xl:btn-xl">
            Open
          </button>
          <button class="btn btn-xs sm:btn-sm md:btn-md lg:btn-lg xl:btn-xl">
            Closed
          </button>
        </div>
      </section>

      <!-- issue count and open closed count -->
      <section
        class="bg-white flex justify-between items-center mt-7 border border-gray-300 rounded-xl p-2"
      >
        <div class="flex items-center justify-center gap-4">
          <img src="./assets/Aperture.png" alt="" />

          <div id="issue-count" class="mt-4">
            <h3 id="issue-total" class="font-semibold text-[24px]"></h3>
            <p id="issue-description" class="text-gray-600">
              Track and manage your project issues
            </p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex items-center justify-center">
            <img src="./assets/Open-Status.png" alt="" />
            <h3>Open</h3>
          </div>
          <div class="flex items-center justify-center">
            <img src="./assets/Closed.png" alt="" />
            <h3>Closed</h3>
          </div>
        </div>
      </section>

      <!-- loading state -->
      <div id="loading" class="flex items-center justify-center gap-4">
        <span class="loading loading-spinner loading-lg"></span>
        <span class="loading loading-spinner loading-lg"></span>
        <span class="loading loading-spinner loading-lg"></span>
      </div>

      <!-- no cards found -->
      <div id="noCards" class="flex items-center justify-center gap-4 p-4">
        <span class="text-gray-600 text-lg">No issues found.</span>
      </div>

      <!-- all cards -->
      <section
        id="card-containar"
        class="bg-white grid grid-cols-3 gap-2 p-5"
      ></section>

      
    </main>

    <script src="./home.js"></script>
  </body>
</html>
